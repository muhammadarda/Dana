<!DOCTYPE html>

<style>

body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:15px}

.qc{background:var(--card2);color:var(--tx);border:0;border-radius:20px;padding:9px 14px;font:inherit;font-weight:600;margin:0 6px 8px 0}

#lk{position:fixed;inset:0;background:var(--bg);z-index:30;display:flex;align-items:center;justify-content:center;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}.lkc{width:100%;max-width:320px;text-align:center;padding:16px}.lkc h2{margin:10px 0 14px;font-size:20px}.dots{display:flex;justify-content:center;gap:14px;min-height:16px;margin-bottom:8px}.dots u{width:14px;height:14px;border-radius:50%;border:2px solid var(--mut)}.dots u.f{background:var(--acc);border-color:var(--acc)}.lm{min-height:38px;color:var(--bad);font-size:13px}.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:6px}.pad button{background:var(--card);color:var(--tx);border:0;border-radius:50%;width:72px;height:72px;font:inherit;font-size:24px;font-weight:600;justify-self:center}.pad .gh{font-size:11px;color:var(--mut);background:none;font-weight:500}
#toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:8px 14px;border-radius:20px;font-size:13px;font-weight:600;z-index:10}
</style>

<script>
var K="keuangan-terpadu-v2",TAB="home",S;

function ymd(d){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}

wealth()+(S.acc.length?"":empty("Mulai dengan menambah rekening, misalnya bank atau e-wallet.","Tambah rekening","addAcc()"))+
catCard("out","Pengeluaran per kategori","bad")+catCard("in","Pemasukan per sumber","ok")}
function hist(){var L=S.tx.map(function(x,k){return[x,k]}).filter(function(p){return inP(p[0].d)}).sort(function(a,b){return a[0].d<b[0].d?1:a[0].d>b[0].d?-1:b[1]-a[1]});

var TPAIRS=["XAUUSD","BTCUSD","EURUSD","GBPUSD","USDJPY"];
var ss=function(n){return(n<0?"−":"")+short(Math.abs(n))};
function trU(x){return x.u!=null?x.u:x.a/(S.kurs||16500)}

function eq(cum){var n=cum.length;if(n<2)return"";var mn=Math.min.apply(0,cum),mx=Math.max.apply(0,cum),rg=(mx-mn)||1,X=function(i){return 8+i*(284/(n-1))},Y=function(v){return 86-(v-mn)/rg*72},pts=cum.map(function(v,i){return X(i)+","+Y(v)}).join(" "),col=cum[n-1]>=0?"#34d399":"#fb7185";

function trading(){var L=S.tr.map(function(x,k){return{x:x,k:k}}).filter(function(p){return inP(p.x.d)}).sort(function(a,b){return a.x.d<b.x.d?-1:a.x.d>b.x.d?1:a.k-b.k}),
t=L.map(function(p){return p.x.a}),P=sum(t),W=t.filter(function(v){return v>0}),Ls=t.filter(function(v){return v<0}),gw=sum(W),gl=-sum(Ls),aw=W.length?gw/W.length:0,al=Ls.length?gl/Ls.length:0,
dep=sum(S.cf.filter(function(c){return c.a>0}).map(function(c){return c.a})),wd=-sum(S.cf.filter(function(c){return c.a<0}).map(function(c){return c.a})),mdl=dep-wd,usd=sum(L.map(function(p){return trU(p.x)})),

t.forEach(function(v){c+=v;cum.push(c);pk=Math.max(pk,c);dd=Math.min(dd,c-pk)});
var st=function(a,b,sub,cl){return'<div class="st"><span class="sm">'+a+"</span><b"+(cl?' class="'+cl+'"':"")+">"+b+"</b>"+(sub?'<span class="sm">'+sub+"</span>":"")+"</div>"},
pm={};L.forEach(function(p){var n=p.x.p||"Lainnya";pm[n]=pm[n]||{n:n,c:0,v:0};pm[n].c++;pm[n].v+=p.x.a});
var pl=Object.keys(pm).map(function(k){return pm[k]}).sort(function(a,b){return b.v-a.v}),pmx=Math.max.apply(0,pl.map(function(o){return Math.abs(o.v)}))||1;

'<div class="card"><div class="row" style="justify-content:space-between"><b>Kurva ekuitas</b><span class="sm">kumulatif</span></div>'+(L.length>1?eq(cum)+'<div class="row sm" style="justify-content:space-between"><span>'+sd(L[0].x.d)+"</span><span>puncak "+ss(pk)+" · kini "+ss(c)+"</span><span>"+sd(L[L.length-1].x.d)+"</span></div>":'<div class="sm" style="margin-top:8px">Catat minimal 2 trade untuk melihat grafik.</div>')+"</div>"+
'<div class="card"><b>Per pair</b>'+pl.map(function(o){return'<div style="margin-top:12px"><div class="row" style="justify-content:space-between"><span>'+esc(o.n)+' <span class="sm">'+o.c+' trade</span></span><b class="'+(o.v>=0?"ok":"bad")+'">'+(o.v>0?"+":"")+rp(o.v)+'</b></div><div class="bar"><u style="width:'+Math.round(Math.abs(o.v)/pmx*100)+"%;background:"+(o.v>=0?"#34d399":"#fb7185")+'"></u></div></div>'}).join("")+"</div>"+
'<div class="card"><b>Daftar trade</b>'+L.slice().reverse().map(function(p){var x=p.x;return'<div class="li"><div>'+esc(x.p||"Trade")+(x.s?' <span class="sm">'+x.s+(x.l?" · "+x.l+" lot":"")+"</span>":"")+'<div class="sm">'+sd(x.d)+(x.n?" · "+esc(x.n):"")+'</div></div><div><b class="'+(x.a>=0?"ok":"bad")+'">'+(x.a>0?"+":"")+rp(x.a)+'</b><button class="x" aria-label="Hapus" onclick="delTr('+p.k+')">×</button></div></div>'}).join("")+"</div>":empty("Belum ada trade di periode ini.","Catat trade","trForm()");
return"<h1>Trading</h1>"+pbar()+'<div class="hero t"><span style="opacity:.85">Profit / loss bersih</span><b>'+(P>0?"+":"")+rp(P)+'</b><div class="row"><div class="chip"><span>Dalam USD</span><i>'+(usd<0?"−":"+")+"$"+Math.abs(usd).toFixed(2)+'</i></div><div class="chip"><span>% modal</span><i>'+(mdl>0?(P/mdl*100).toFixed(1).replace(".",",")+"%":"–")+'</i></div><div class="chip"><span>Trade</span><i>'+t.length+"</i></div></div></div>"+
(L.length?'<button class="btn" onclick="trForm()">+ Catat trade</button>':"")+body+
'<div class="card"><div class="row" style="justify-content:space-between"><b>Modal trading</b><b>'+rp(mdl)+'</b></div><div class="sm">Setoran '+rp(dep)+" · Penarikan "+rp(wd)+"</div>"+S.cf.map(function(c,k){return[c,k]}).slice(-5).reverse().map(function(p){var c=p[0];return'<div class="li"><div>'+(c.a>0?"Setoran":"Penarikan")+'<div class="sm">'+sd(c.d)+(c.n?" · "+esc(c.n):"")+'</div></div><div><b class="'+(c.a>0?"ok":"bad")+'">'+rp(c.a)+'</b><button class="x" aria-label="Hapus" onclick="delCf('+p[1]+')">×</button></div></div>'}).join("")+'<button class="btn g" style="margin-top:10px" onclick="cfForm()">Catat setoran / penarikan</button></div>'+

function csvq(v){v=String(v==null?"":v);return/[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v}
async function saveFile(name,data,mime){var dl=null;try{if(window.claude&&window.claude.use)dl=await window.claude.use("downloads")}catch(e){}
if(dl){try{await dl.save({filename:name,data:data});return true}catch(e){if(e&&e.code=="declined")return false}}
try{var u=URL.createObjectURL(new Blob([data],{type:mime})),a=document.createElement("a");a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(function(){URL.revokeObjectURL(u)},4000);return true}catch(e){return false}}
async function fileBackup(){var old=S.lb;S.lb=Date.now();var ok=await saveFile("keuangan-backup-"+ymd(new Date())+".json",JSON.stringify(S),"application/json");if(ok){save();close_();draw();toast("Cadangan disimpan")}else S.lb=old}
async function shareBackup(){var old=S.lb;S.lb=Date.now();try{var f=new File([JSON.stringify(S)],"keuangan-backup-"+ymd(new Date())+".json",{type:"application/json"});await navigator.share({files:[f],title:"Cadangan Keuangan Terpadu"});save();close_();draw();toast("Cadangan dibagikan")}catch(e){S.lb=old}}
async function csvOut(){var R=[["Tanggal","Jenis","Kategori","Rekening","Ke rekening","Jumlah","Catatan"]];
S.tx.slice().sort(function(a,b){return a.d<b.d?-1:a.d>b.d?1:0}).forEach(function(x){R.push([x.d,x.t=="in"?"Pemasukan":x.t=="out"?"Pengeluaran":"Transfer",x.c,x.acc,x.to||"",x.t=="out"?-x.a:x.a,x.n||""])});
S.tr.forEach(function(x){R.push([x.d,"Trade",x.p||"Trading",x.s||"","",x.a,[x.l?x.l+" lot":"",x.n||""].filter(Boolean).join(" · ")])});S.cf.forEach(function(c){R.push([c.d,c.a>0?"Setoran modal":"Penarikan modal","Trading","","",c.a,c.n||""])});
var ok=await saveFile("keuangan-transaksi-"+ymd(new Date())+".csv","\ufeff"+R.map(function(r){return r.map(csvq).join(",")}).join("\r\n"),"text/csv");if(ok)toast("File CSV disimpan")}
function restoreFile(inp){var f=inp.files&&inp.files[0];if(!f)return;var r=new FileReader();r.onload=function(){try{var d=JSON.parse(r.result);if(!d.acc||!d.tx||!d.tr)throw 0;S=d;mig();syncJ();save();close_();draw();toast("Data dipulihkan")}catch(e){toast("File tidak valid")}};r.readAsText(f)}
function backup(){var cs=false;try{cs=!!(navigator.canShare&&navigator.canShare({files:[new File(["x"],"a.json",{type:"application/json"})]}))}catch(e){}
modal('<h2>Cadangan data</h2><p class="sm">'+(S.lb?"Terakhir dicadangkan: "+new Date(S.lb).toLocaleDateString("id-ID",{day:"numeric",month:"long",year:"numeric"})+".":"Belum pernah dicadangkan.")+' Simpan filenya di tempat aman, misalnya Google Drive atau kirim ke dirimu sendiri.</p><button class="btn" onclick="fileBackup()">Simpan cadangan ke file</button>'+(cs?'<button class="btn g" onclick="shareBackup()">Bagikan file cadangan</button>':"")+'<button class="btn g" onclick="csvOut()">Ekspor transaksi (CSV)</button><label class="btn g" style="display:block;text-align:center;cursor:pointer">Pulihkan dari file<input type="file" accept=".json,application/json,text/plain" style="display:none" onchange="restoreFile(this)"></label><p class="sm">Memulihkan akan menggantikan semua data saat ini.</p><details><summary class="sm" style="cursor:pointer">Cara lain: salin &amp; tempel teks</summary><textarea id="bk" rows="5" style="margin-top:8px">'+esc(JSON.stringify(S))+'</textarea><div class="row"><button class="btn g" onclick="cp()">Salin</button><button class="btn g" onclick="rs()">Pulihkan</button></div></details>')}
function cp(){var t=$("bk");t.select();try{document.execCommand("copy");S.lb=Date.now();save();toast("Tersalin")}catch(e){toast("Salin manual dari kolom")}}
function rs(){try{var d=JSON.parse($("bk").value);if(!d.acc||!d.tx||!d.tr)throw 0;S=d;mig();syncJ();save();close_();draw();toast("Data dipulihkan")}catch(e){toast("Format data tidak valid")}}
if(PIN)lock();else draw();
if("serviceWorker" in navigator){try{navigator.serviceWorker.register("sw.js")}catch(e){}}
</script>
</body>
